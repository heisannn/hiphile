[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/hiphile"]

[workspace.package]
version = "0.2.0"
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
account = { path = "crates/account" }
actions = { path = "crates/actions" }
artists = { path = "crates/artists" }
audio = { path = "crates/audio" }
catalog = { path = "crates/catalog" }
client = { path = "crates/client" }
config = { path = "crates/config" }
dsd = { path = "crates/dsd" }
favorites = { path = "crates/favorites" }
fuzzy = { path = "crates/fuzzy" }
home = { path = "crates/home" }
library = { path = "crates/library" }
lyrics = { path = "crates/lyrics" }
media-controls = { path = "crates/media-controls" }
net = { path = "crates/net" }
playback = { path = "crates/playback" }
player = { path = "crates/player" }
playlists = { path = "crates/playlists" }
presence = { path = "crates/presence" }
search = { path = "crates/search" }
session = { path = "crates/session" }
settings = { path = "crates/settings" }
songs = { path = "crates/songs" }
subsonic = { path = "crates/subsonic" }
ui = { path = "crates/ui" }
updater = { path = "crates/updater" }

anyhow = "1.0"
apple-native-keyring-store = { version = "1.0", features = ["keychain"] }
async-channel = "2.5"
base64 = "0.23"
bytes = "1.12"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive", "env"] }
config-rs = { package = "config", version = "0.15", default-features = false, features = ["toml"] }
cpal = "0.18"
dirs = "7.0"
discord-rich-presence = "1.1"
embed-resource = "3.0"
futures = "0.3"
http = "1.5"
gpui-kit = { version = "0.9", features = ["gpui-fast"] }
hex = "0.4"
keyring-core = "1.0"
# Pinned: a new version may read compiled dictionaries differently, and the bundle in
# `crates/fuzzy/src/bundle.rs` is compiled by this one.
lindera = { version = "=6.2.0", default-features = false, features = ["mmap"] }
md-5 = "0.11"
nucleo-matcher = "0.3"
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFString"] }
rand = "0.10"
raw-window-handle = "0.6"
reqwest = "0.13"
roxmltree = "0.21"
rtrb = "0.4"
rubato = "5.0"
ruzstd = "0.8"
rusqlite = { version = "0.41", features = ["bundled"] }
self_update = { version = "1.3", default-features = false, features = [
    "archive-zip",
    "checksums",
    "compression-zip-deflate",
    "github",
    "reqwest",
    "rustls",
] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.11"
# zbus rather than the default dbus, which needs a system library on Linux
souvlaki = { version = "0.9", default-features = false, features = ["use_zbus"] }
symphonia = { version = "0.6", features = ["all"] }
tar = "0.4"
tempfile = "3.27"
thiserror = "2.0"
toml_edit = "0.25"
unicode-normalization = "0.1"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros"] }
url = "2.5"
windows-native-keyring-store = "1.1"
zbus-secret-service-keyring-store = { version = "1.0", features = ["crypto-rust"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
too_many_lines = "warn"

[profile.dev.package]
dsd = { opt-level = 3 }
rubato = { opt-level = 3 }
realfft = { opt-level = 3 }
rustfft = { opt-level = 3 }
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-fast = { opt-level = 3 }
gpui-fast-platform = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
