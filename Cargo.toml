[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/hiphile"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# Internal crates
account = { path = "crates/account" }
actions = { path = "crates/actions" }
artists = { path = "crates/artists" }
audio = { path = "crates/audio" }
catalog = { path = "crates/catalog" }
client = { path = "crates/client" }
config = { path = "crates/config" }
home = { path = "crates/home" }
library = { path = "crates/library" }
net = { path = "crates/net" }
playback = { path = "crates/playback" }
player = { path = "crates/player" }
playlists = { path = "crates/playlists" }
presence = { path = "crates/presence" }
search = { path = "crates/search" }
session = { path = "crates/session" }
settings = { path = "crates/settings" }
songs = { path = "crates/songs" }
subsonic = { path = "crates/subsonic" }
ui = { path = "crates/ui" }

# External crates
anyhow = "1.0"
apple-native-keyring-store = { version = "1.0", features = ["keychain"] }
async-channel = "2.5"
bytes = "1.12"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive", "env"] }
config-rs = { package = "config", version = "0.15", default-features = false, features = ["toml"] }
cpal = "0.18"
dirs = "7.0"
discord-rich-presence = "1.1"
futures = "0.3"
http = "1.5"
gpui-kit = { version = "0.9", features = ["gpui-fast"] }
hex = "0.4"
keyring-core = "1.0"
md-5 = "0.11"
rand = "0.10"
reqwest = "0.13"
rtrb = "0.4"
rubato = "5.0"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
symphonia = { version = "0.6", features = ["all"] }
tempfile = "3.27"
thiserror = "2.0"
toml_edit = "0.25"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros"] }
url = "2.5"
windows-native-keyring-store = "1.1"
zbus-secret-service-keyring-store = { version = "1.0", features = ["crypto-rust"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
too_many_lines = "warn"

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-fast = { opt-level = 3 }
gpui-fast-platform = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
