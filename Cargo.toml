[workspace]
resolver = "3"
members = ["crates/*", "next/*"]
default-members = ["crates/hiphile"]

[workspace.package]
version = "0.5.0"
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
account = { path = "crates/account" }
actions = { path = "crates/actions" }
artists = { path = "crates/artists" }
audio = { path = "crates/audio" }
catalog = { path = "crates/catalog" }
client = { path = "crates/client" }
config = { path = "crates/config" }
dsd = { path = "crates/dsd" }
dsp = { path = "crates/dsp" }
executor = { path = "crates/executor" }
favorites = { path = "crates/favorites" }
fuzzy = { path = "crates/fuzzy" }
gpui-host = { path = "crates/gpui-host" }
hiphile-core = { path = "crates/hiphile-core" }
home = { path = "crates/home" }
library = { path = "crates/library" }
lyrics = { path = "crates/lyrics" }
media-controls = { path = "crates/media-controls" }
net = { path = "crates/net" }
playback = { path = "crates/playback" }
player = { path = "crates/player" }
playlists = { path = "crates/playlists" }
presence = { path = "crates/presence" }
r8brain = { path = "crates/r8brain" }
search = { path = "crates/search" }
session = { path = "crates/session" }
settings = { path = "crates/settings" }
songs = { path = "crates/songs" }
soxr = { path = "crates/soxr" }
subsonic = { path = "crates/subsonic" }
ui = { path = "crates/ui" }
updater = { path = "crates/updater" }

next-account = { path = "next/account" }
next-host = { path = "next/host" }
next-platform = { path = "next/platform" }
next-player = { path = "next/player" }
next-ui = { path = "next/ui" }

anyhow = "1.0"
# Pinned to a revision: upstream has no releases, and each update is made on purpose
anti-webui = { git = "https://github.com/bea4dev/AntiWebUI", rev = "25e82a1d2a7a08658f0eede14cde47b34cce40a6", default-features = false, features = ["macos", "svg"] }
anti-webui-md3e = { git = "https://github.com/bea4dev/AntiWebUI", rev = "25e82a1d2a7a08658f0eede14cde47b34cce40a6" }
apple-native-keyring-store = { version = "1.0", features = ["keychain"] }
async-channel = "2.5"
base64 = "0.23"
bytes = "1.12"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive", "env"] }
config-rs = { package = "config", version = "0.15", default-features = false, features = ["toml"] }
cpal = "0.18"
dirs = "7.0"
discord-rich-presence = "1.1"
embed-resource = "3.0"
futures = "0.3"
http = "1.5"
gpui-kit = { version = "0.9.1", features = ["gpui-fast"] }
hex = "0.4"
keyring-core = "1.0"
libc = "0.2"
# Pinned: a new version may read compiled dictionaries differently, and the bundle in
# `crates/fuzzy/src/bundle.rs` is compiled by this one.
lindera = { version = "=6.2.0", default-features = false, features = ["mmap"] }
md-5 = "0.11"
nucleo-matcher = "0.3"
# objc2 and its frameworks at the versions AntiWebUI's macOS backend uses, so that there is one of each
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std"] }
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFString"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std"] }
rand = "0.10"
raw-window-handle = "0.6"
realfft = "3.5"
reqwest = "0.13"
roxmltree = "0.21"
rtrb = "0.4"
rubato = "5.0"
ruzstd = "0.8"
rusqlite = { version = "0.41", features = ["bundled"] }
self_update = { version = "1.3", default-features = false, features = [
    "archive-zip",
    "checksums",
    "compression-zip-deflate",
    "github",
    "reqwest",
    "rustls",
] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.11"
# zbus rather than the default dbus, which needs a system library on Linux
souvlaki = { version = "0.9", default-features = false, features = ["use_zbus"] }
symphonia = { version = "0.6", features = ["all"] }
tar = "0.4"
tempfile = "3.27"
thiserror = "2.0"
toml_edit = "0.25"
unicode-normalization = "0.1"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros"] }
url = "2.5"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Threading",
] }
windows-core = "0.62"
windows-native-keyring-store = "1.1"
zbus-secret-service-keyring-store = { version = "1.0", features = ["crypto-rust"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
too_many_lines = "warn"

[profile.dev.package]
dsd = { opt-level = 3 }
dsp = { opt-level = 3 }
r8brain = { opt-level = 3 }
soxr = { opt-level = 3 }
rubato = { opt-level = 3 }
realfft = { opt-level = 3 }
rustfft = { opt-level = 3 }
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-fast = { opt-level = 3 }
gpui-fast-platform = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
