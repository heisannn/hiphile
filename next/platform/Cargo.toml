[package]
name = "next-platform"
description = "What the app on AntiWebUI asks of AppKit itself: the menu bar, the main window, the appearance and LANG."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anti-webui.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = [
  "NSAccessibility",
  "NSAppearance",
  "NSApplication",
  "NSButton",
  "NSCell",
  "NSControl",
  "NSEvent",
  "NSMenu",
  "NSMenuItem",
  "NSResponder",
  "NSView",
  "NSWindow",
  "NSWorkspace",
] }
objc2-foundation = { workspace = true, features = [
  "NSArray",
  "NSDictionary",
  "NSKeyValueObserving",
  "NSNotification",
  "NSString",
] }

# `set_lang` is for the start of a process, on its main thread, where the default harness never runs
# a test
[[test]]
name = "lang"
harness = false

[lints]
workspace = true
