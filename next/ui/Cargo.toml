[package]
name = "next-ui"
description = "What the screens on AntiWebUI share: the theme, the type, and parts that more than one shows."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anti-webui.workspace = true
anti-webui-md3e.workspace = true
config.workspace = true
executor = { workspace = true, optional = true }
hiphile-core.workspace = true
net = { workspace = true, optional = true }
next-host.workspace = true
tempfile = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread"] }

[features]
# Driving views without a window, on a core of their own, for the tests of the crates that show them
test-support = [
  "dep:executor",
  "dep:net",
  "dep:tempfile",
  "dep:tokio",
  "hiphile-core/test-support",
]

[dev-dependencies]
next-ui = { path = ".", features = ["test-support"] }

[lints]
workspace = true
