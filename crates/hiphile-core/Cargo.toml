[package]
name = "hiphile-core"
description = "The app's state and logic, for any UI. No GPUI."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
async-channel = { workspace = true, optional = true }
audio.workspace = true
catalog.workspace = true
chrono.workspace = true
client.workspace = true
config.workspace = true
dirs.workspace = true
executor.workspace = true
futures.workspace = true
fuzzy.workspace = true
lyrics.workspace = true
media-controls = { workspace = true, optional = true }
net.workspace = true
playback.workspace = true
presence = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
session.workspace = true
subsonic.workspace = true
tokio = { workspace = true, features = ["sync"] }
url = { workspace = true, optional = true }

[features]
# What only a desktop has, which the desktop app turns on
desktop = [
  "dep:async-channel",
  "dep:media-controls",
  "dep:presence",
  "dep:url",
]
test-support = ["dep:serde_json"]

[dev-dependencies]
audio = { workspace = true, features = ["test-support"] }
executor = { workspace = true, features = ["test-support"] }
lyrics = { workspace = true, features = ["test-support"] }
playback = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
tempfile.workspace = true
url.workspace = true

[lints]
workspace = true
