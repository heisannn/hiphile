[package]
name = "hiphile-cli"
description = "Command-line OpenSubsonic client. Must not depend on GPUI."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
audio.workspace = true
catalog.workspace = true
clap.workspace = true
client.workspace = true
config.workspace = true
executor.workspace = true
futures.workspace = true
hiphile-core.workspace = true
net.workspace = true
playback.workspace = true
session.workspace = true
subsonic.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
hiphile-core = { workspace = true, features = ["test-support"] }
playback = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
