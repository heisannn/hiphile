[package]
name = "config"
description = "Server profiles and keychain passwords shared by the GUI and the CLI. No GPUI."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
test-support = []

[dependencies]
config-rs.workspace = true
dirs.workspace = true
keyring-core.workspace = true
serde.workspace = true
thiserror.workspace = true
toml_edit.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store.workspace = true

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store.workspace = true

[lints]
workspace = true
